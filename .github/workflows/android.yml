name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 platform-tools

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, testes unitários e lint
        run: ./gradlew :app:assembleDebug test lint :app:assembleDebugAndroidTest --stacktrace

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/
            feature/*/build/reports/
            core/*/build/reports/
          if-no-files-found: ignore
