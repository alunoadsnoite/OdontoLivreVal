version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
        versions: [">= 9.5.1"]
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
        versions: [">= 2.4.21"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"